[package]
name = "simple-narrator"
version = "0.1.0"
description = "Narrate PDF documents aloud with local text-to-speech"
authors = ["martin"]
edition = "2021"

[lib]
name = "simple_narrator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
narration-sync = { path = "../crates/narration-sync" }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pdf-extract = "0.9"
whatlang = "0.16"
